site_name: Vibe Coding × GWAS：公共衛生與生醫研究的 AI 程式實作
site_description: 給研究生的 14 小時課程：從零開始用 AI 寫程式，完整走過一次全基因體關聯研究（GWAS）與頂尖期刊常用的後續分析
repo_url: https://github.com/greengarden0925/VibeCoding-GWAS
edit_uri: edit/main/docs/
site_url: https://greengarden0925.github.io/VibeCoding-GWAS/

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首頁: index.md
  - 課程資訊:
      - 使用說明: usage.md
      - 14 小時課程時程: syllabus.md
  - 講義:
      - 第一部分　Vibe coding 基礎:
          - chapters/L01.md
          - chapters/L02.md
          - chapters/L03.md
          - chapters/L04.md
      - 第二部分　GWAS 觀念與資料:
          - chapters/L05.md
          - chapters/L06.md
      - 第三部分　用 vibe coding 完成一次 GWAS:
          - chapters/L07.md
          - chapters/L08.md
          - chapters/L09.md
          - chapters/L10.md
      - 第四部分　頂尖期刊的後續分析方法:
          - chapters/L11.md
          - chapters/L12.md
          - chapters/L13.md
          - chapters/L14.md
  - 影片總表: videos.md
  - 頂尖期刊方法盤點: methods-survey.md
  - 名詞全寫: glossary.md
  - 參考文獻: references.md
  - 維護指南: maintenance.md
